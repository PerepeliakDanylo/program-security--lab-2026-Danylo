; ============================================================================
;  DynamicReloadSpeed.ini  --  PRESET: MUNITIONS COMPATIBILITY
;  RDR2 Dynamic Reload 1.2.1 or later (1.2.3 recommended) + Munitions
;  (Standalone or CI - GI Merge, with its Patch Fix). Single player only.
;
;  STATUS: prepared from Munitions' own files (weapons.ymt, Munitions.asi) and
;  tested by a player on a Munitions build (~150 scripts, 2026-11-18/19): all
;  65 guns found, Munitions' 8 extra guns included, and CALM / COMBAT switching
;  confirmed in his log and in game. The author does not use Munitions himself;
;  feedback with a DynamicReloadSpeed.log is welcome on the mod page (Posts).
;
;  WHY THIS PRESET EXISTS
;      The Munitions overhaul leaves AnimReloadRate at vanilla (1.00 / 1.30) on
;      the 52 stock-signature weapons, so offset discovery still works out of
;      the box and combat reloads stay at Munitions' own timing. However,
;      Munitions also lowers LoopRate in weapons.ymt on most guns and adds
;      custom weapons (Army Revolver, M1903 Pistol, Merwin Revolver, Deer &
;      Frontier Repeaters, Semi-Auto & Buffalo Rifles, plus 1.10/0.725 base
;      rates on Navy/Lowry/Army and M1899/M1903).
;
;      Using the default stock-calibrated Calm_AnimReloadRate values stacks on
;      top of Munitions' slower LoopRate, while Mode = auto skips unlisted
;      weapons whose loaded AnimReloadRate is not 1.00 or 1.30 (Army, Lowry,
;      M1903).
;
;      Setting Mode = manual with CalmSource = multiplier and CombatSource =
;      snapshot fixes both: every gun picked up by the class scan (including
;      Munitions' custom DLC guns with IncludeUnlistedGuns = 1) scales its own
;      Munitions AnimReloadRate by CalmAnimReloadRateMul out of combat and
;      restores Munitions' exact loaded snapshot value in combat, while
;      PatchSectionedReload remains 0 so Munitions' LoopRate and
;      TimeBetweenBulletsInLoop are never overwritten.
;
;  NO MEMORY-SEARCH SECTION, BY DESIGN
;      Like presets\subtle.ini, realistic.ini and hardcore.ini, this preset
;      carries timing profile values only (no memory-search section, no override switch).
;
;  HOW TO USE
;      1. Make sure DynamicReloadSpeed.asi (1.2.1 or later) is installed in your
;         RDR2 root and Munitions is installed as instructed on its Nexus page.
;      2. Back up your existing DynamicReloadSpeed.ini, copy this file next to
;         DynamicReloadSpeed.asi, and rename it to DynamicReloadSpeed.ini.
;      3. Press F9 in game (or restart the game).
;
;  TUNING
;      Adjust [Defaults] CalmAnimReloadRateMul (and keep CalmTimeBetweenMul =
;      1 / CalmAnimReloadRateMul). Lower = slower out-of-combat reload:
;        0.8000 / 1.2500 = mild slowdown on top of Munitions
;        0.6667 / 1.5000 = balanced default for Munitions (1.5x AnimReloadRate factor)
;        0.5000 / 2.0000 = heavier slowdown on top of Munitions
; ============================================================================

[General]
Enabled             = 1
CooldownSeconds     = 5.0     ; delay before COMBAT -> CALM; COMBAT is entered instantly
DetectorHz          = 4       ; how often combat signals are polled
PedScanHz           = 2       ; how often nearby peds are enumerated (the expensive signal)
ThreatRadius        = 80.0    ; metres; peds further away are ignored
MaxPedsScanned      = 32      ; how many of the NEAREST peds inside ThreatRadius are checked
DamageMemorySeconds = 8.0     ; "player was hit" and "player shot at a person" stay true this long
DisableInOnline     = 1       ; hard-disable for the rest of the session if a session is detected
; Before entering Red Dead Online, delete DynamicReloadSpeed.asi. The plugin
; disabling itself does not remove the module from the game process.

[Signals]
; Each signal can be turned off independently. Aiming alone never counts as
; combat - it only counts when a hostile is nearby or you were hit recently,
; otherwise aiming at a deer would flip you into COMBAT.
PlayerShooting         = 0   ; 1 = any shot (also into the air or at game) starts COMBAT
PlayerAiming           = 1
Melee                  = 1
RecentDamage           = 1
HostileNearby          = 1
WantedByLaw            = 1
DeadEye                = 0
AttackingHumans        = 1   ; a shot aimed at a person starts COMBAT even with PlayerShooting = 0
ShootingSustainsCombat = 1   ; during COMBAT/COOLDOWN your own shots keep the fight on

[Profiles]
Mode         = manual
CalmSource   = multiplier
CombatSource = snapshot

[Defaults]
; Applies to all managed guns (table weapons, DLC weapons, and unlisted Munitions
; weapons) because CalmSource = multiplier and CombatSource = snapshot.
; Note: reload timing is global CWeaponInfo data, so NPCs share the current rate.
CalmAnimReloadRateMul   = 0.6667  ; out of combat = loaded Munitions rate * 0.6667
CalmLoopRateMul         = 1.00    ; DO NOT TOUCH
CalmTimeBetweenMul      = 1.5000  ; == 1 / CalmAnimReloadRateMul
CombatAnimReloadRateMul = 1.00
CombatLoopRateMul       = 1.00
CombatTimeBetweenMul    = 1.00
VanillaEpsilon          = 0.02    ; tolerance when comparing a snapshot against [Vanilla]
MinValue                = 0.05    ; nothing below this is ever written
MaxValue                = 12.0    ; nothing above this is ever written

[Versions]
; Game builds this mod has been run on. Left empty on purpose so a clean
; install works on every build. Add your build from the log's "game build" line
; if you want to lock the plugin to a specific patch.
; Supported = 1.0.1491.50

[Debug]
LogLevel           = info      ; off | error | info | debug
LogFile            = DynamicReloadSpeed.log
MaxLogSizeMB       = 32        ; past this the logger writes one line and stops
OnScreenState      = 0         ; 1 = state line on screen + held weapon reload rate
HotkeyToggleMod    = F7        ; enable / disable the whole mod, restoring loaded boot values
HotkeyForceCombat  = F8        ; force COMBAT, for testing
HotkeyReloadConfig = F9        ; re-read this file without restarting the game

; ============================================================================
;  [Vanilla] - stock AnimReloadRate signature values for offset discovery
;  Munitions keeps 1.00 / 1.30 on all 52 stock-signature entries in weapons.ymt.
; ============================================================================

[Vanilla]
WEAPON_RIFLE_VARMINT            = 1.30
WEAPON_REPEATER_CARBINE         = 1.30
WEAPON_REPEATER_WINCHESTER      = 1.30
WEAPON_REPEATER_HENRY           = 1.30
WEAPON_RIFLE_BOLTACTION         = 1.30
WEAPON_RIFLE_SPRINGFIELD        = 1.00
WEAPON_SNIPERRIFLE_ROLLINGBLOCK = 1.00
WEAPON_SNIPERRIFLE_CARCANO      = 1.00
WEAPON_REVOLVER_CATTLEMAN       = 1.00
WEAPON_REVOLVER_SCHOFIELD       = 1.00
WEAPON_REVOLVER_DOUBLEACTION    = 1.00
WEAPON_PISTOL_VOLCANIC          = 1.00
WEAPON_PISTOL_MAUSER            = 1.00
WEAPON_PISTOL_SEMIAUTO          = 1.00
WEAPON_SHOTGUN_PUMP             = 1.00
WEAPON_SHOTGUN_REPEATING        = 1.00
WEAPON_SHOTGUN_SEMIAUTO         = 1.00
WEAPON_SHOTGUN_DOUBLEBARREL     = 1.00
WEAPON_SHOTGUN_SAWEDOFF         = 1.00
