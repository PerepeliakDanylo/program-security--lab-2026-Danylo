; ============================================================================
;  DynamicReloadSpeed.ini
;  RDR2 Dynamic Reload 1.1 — slow, deliberate reloads out of combat;
;  fast, near-vanilla reloads in a gunfight. Single player only.
;
;  Rename this file to DynamicReloadSpeed.ini and put it in the game root,
;  next to RDR2.exe and DynamicReloadSpeed.asi.
;
;  CALM values for the 19 weapons that exist in weapons.ymt were calibrated from
;  in-game stopwatch measurements and verified once in game (Varmint Rifle,
;  target 18.0 s, measured ~18 s). COMBAT values for those 19 are the stock
;  Rockstar values, read out of an unmodified weapons.ymt on 2026-09-26.
;
;  The last five sections are DIFFERENT and say so in their own header: those
;  weapons have no entry in weapons.ymt at all, nothing about them could be
;  measured, and every value there is an estimate marked TODO.
;
;  Timing model (this is why the three numbers are not independent):
;      T = A/r + N * L/(lr * r) + N * tb
;      r  = AnimReloadRate            lower  = slower
;      lr = LoopRate                  lower  = slower
;      tb = TimeBetweenBulletsInLoop  higher = slower
;      N  = rounds loaded, A / L = internal animation lengths
;  r scales the per-round loop as well, so a slowdown derived from a
;  multiplier must divide r and multiply tb, and must leave lr alone.
; ============================================================================

[General]
Enabled             = 1
CooldownSeconds     = 5.0     ; delay before COMBAT -> CALM; COMBAT is entered instantly
DetectorHz          = 4       ; how often combat signals are polled
PedScanHz           = 2       ; how often nearby peds are enumerated (the expensive signal)
ThreatRadius        = 80.0    ; metres; peds further away are ignored
MaxPedsScanned      = 32      ; hard cap per scan
DamageMemorySeconds = 8.0     ; "player was hit recently" stays true this long
; Before entering Red Dead Online, delete DynamicReloadSpeed.asi. The plugin
; disabling itself does not remove the module from the game process.
DisableInOnline     = 1       ; hard-disable for the rest of the session if a session is detected
IgnoreVersionCheck  = 0       ; 1 = patch even an unlisted game build (you are on your own)

[Signals]
; Each signal can be turned off independently. Aiming alone never counts as
; combat - it only counts when a hostile is nearby or you were hit recently,
; otherwise aiming at a deer would flip you into COMBAT.
PlayerShooting = 1
PlayerAiming   = 1
Melee          = 1
RecentDamage   = 1
HostileNearby  = 1
WantedByLaw    = 1   ; law is actively after you (a pursuit, not just a bounty)
DeadEye        = 0   ; works, but off until it has been checked in a real session:
                     ; a false positive here would hold COMBAT during quiet riding

[Profiles]
Mode = auto
; auto   (default) : per weapon, compare the values the game loaded at boot with
;                    the [Vanilla] table below.
;                      snapshot ~= vanilla  -> COMBAT = snapshot, CALM = this file
;                      snapshot != vanilla  -> CALM   = snapshot, COMBAT = this file
;                    Every decision is logged with both value sets.
; manual          : obey CalmSource / CombatSource literally. Deterministic;
;                    use this if you run a third-party weapon overhaul and want
;                    identical behaviour regardless of what it loaded.
CalmSource   = ini
CombatSource = snapshot

[Defaults]
; Fallbacks for any weapon with no section of its own.
; These three are NOT independent: CalmTimeBetweenMul must be 1 / CalmAnimReloadRateMul,
; and CalmLoopRateMul must stay 1.00 (AnimReloadRate already scales the loop).
; A config that breaks either rule is applied as written, with a warning naming both keys.
CalmAnimReloadRateMul   = 0.50   ; 0.50 == "twice as slow as whatever was loaded"
CalmLoopRateMul         = 1.00   ; DO NOT TOUCH
CalmTimeBetweenMul      = 2.00   ; == 1 / CalmAnimReloadRateMul
CombatAnimReloadRateMul = 1.00
CombatLoopRateMul       = 1.00
CombatTimeBetweenMul    = 1.00
VanillaEpsilon          = 0.02   ; tolerance when comparing a snapshot against [Vanilla]
MinValue                = 0.05   ; nothing below this is ever written
MaxValue                = 12.0   ; nothing above this is ever written.
                                 ; Not 8.0: stock LoopRate for WEAPON_PISTOL_SEMIAUTO is
                                 ; 10.0, and a cap below that would clamp a genuine stock
                                 ; value and leave that pistol permanently slowed.

[Memory]
; Search parameters for the resolver. There is deliberately NO key here that can
; name an address or a base pointer: targets are found by hashing the weapon name,
; and the field offset is measured on your machine, not shipped as a constant.
; That is also why this mod does not need a new build after a game update.
MaxOffsetWindow         = 4096   ; bytes; candidate field offsets are searched in [0, this)
OffsetStep              = 4      ; float alignment
MinConsensusWeapons     = 12     ; an offset is accepted only if this many weapons agree
ConsensusMargin         = 1.5    ; the winning offset must beat the runner-up by this factor
MaxScanBytes            = 0      ; 0 = no limit; raise only if init is too slow on your machine
PatchAllConditions      = 1      ; patch GoodCondition/WornCondition/*OH, preserving their ratios
; ForceAnimReloadRateOffset = 0  ; commented out or 0 = auto (recommended). Only set this to a value the log printed for you.
; ForceLoopRateOffset       = 0
; ForceTimeBetweenOffset    = 0

[Versions]
; Game builds this mod has been run on. An unlisted build is refused unless
; IgnoreVersionCheck = 1. The log line "game build" prints your build: it is the
; same four numbers Windows shows in RDR2.exe -> Properties -> Details.
; Both forms are accepted here: 1.0.1491.50 and the short 1491.50.
;
; The list is left EMPTY on purpose. Empty means "no check configured, carry on",
; so a clean install works on every build. Uncomment the line below to lock the
; mod to the build it was developed and tested against.
; Supported = 1.0.1491.50

[Debug]
LogLevel           = info      ; off | error | info | debug   (debug is verbose, do not leave it on)
LogFile            = DynamicReloadSpeed.log
MaxLogSizeMB       = 32        ; past this the logger writes one line and stops; it never rotates
OnScreenState      = 0         ; 1 = show version, state, cooldown and hostile count on screen
HotkeyToggleMod    = F7        ; enable / disable the whole mod, restoring original values
HotkeyForceCombat  = F8        ; force COMBAT, for testing
HotkeyReloadConfig = F9        ; re-read this file without restarting the game

; ============================================================================
;  [Vanilla] — stock values, for Mode = auto and for offset discovery
;
;  Read out of an unmodified weapons.ymt on 2026-09-26. Only AnimReloadRate is
;  listed: in stock data it takes exactly two values, 1.00 and 1.30, and that
;  1.00/1.30 split is what lets the resolver recognise the right field in memory.
;  Edit only if Rockstar changes stock values.
; ============================================================================

[Vanilla]
WEAPON_RIFLE_VARMINT            = 1.30
WEAPON_REPEATER_CARBINE         = 1.30
WEAPON_REPEATER_WINCHESTER      = 1.30
WEAPON_REPEATER_HENRY           = 1.30
WEAPON_RIFLE_BOLTACTION         = 1.30
WEAPON_RIFLE_SPRINGFIELD        = 1.00
WEAPON_SNIPERRIFLE_ROLLINGBLOCK = 1.00
WEAPON_SNIPERRIFLE_CARCANO      = 1.00
WEAPON_REVOLVER_CATTLEMAN       = 1.00
WEAPON_REVOLVER_SCHOFIELD       = 1.00
WEAPON_REVOLVER_DOUBLEACTION    = 1.00
WEAPON_PISTOL_VOLCANIC          = 1.00
WEAPON_PISTOL_MAUSER            = 1.00
WEAPON_PISTOL_SEMIAUTO          = 1.00
WEAPON_SHOTGUN_PUMP             = 1.00
WEAPON_SHOTGUN_REPEATING        = 1.00
WEAPON_SHOTGUN_SEMIAUTO         = 1.00
WEAPON_SHOTGUN_DOUBLEBARREL     = 1.00
WEAPON_SHOTGUN_SAWEDOFF         = 1.00
; The five weapons below have no CWeaponInfo entry in weapons.ymt at all -
; confirmed on both a merged overhaul file and on pristine stock data. Their
; stock AnimReloadRate is therefore unknown and they take no part in offset
; discovery. Whether the plugin can reach them at all is answered by the
; resolver log line "hash not found in memory".
; WEAPON_REVOLVER_LEMAT  = ?
