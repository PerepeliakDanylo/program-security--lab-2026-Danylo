; WEAPON_RIFLE_ELEPHANT  = ?

; ============================================================================
;  Per-weapon profiles
;
;  Calm_*   : measured and tuned, slow. Do not scale these by hand - they were
;             solved from a stopwatch measurement through the timing model above.
;  Combat_* : stock Rockstar values. LoopRate / TimeBetweenBulletsInLoop are the
;             GoodCondition values of the weapon's sectioned-reload profile.
;  The *_LoopRate and *_TimeBetweenBulletsInLoop keys are used only with
;  PatchSectionedReload = 1; by default only AnimReloadRate is switched.
;
;  Variant weapons (_MEXICAN, _PIG, _EXOTIC, _GOLDEN, _DUALWIELD, character
;  variants like _JOHN or _SADIE) are matched by longest configured prefix, so
;  WEAPON_REVOLVER_CATTLEMAN_MEXICAN uses [WEAPON_REVOLVER_CATTLEMAN] below and
;  the High Roller (WEAPON_REVOLVER_DOUBLEACTION_GAMBLER) uses
;  [WEAPON_REVOLVER_DOUBLEACTION].
; ============================================================================

; ---------------------------------------------------------------- long guns --

