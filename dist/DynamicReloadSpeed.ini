; ============================================================================
;  Weapons with no entry in weapons.ymt
;
;  These five have no CWeaponInfo in the game's weapon metadata - verified on
;  stock data, so this is Rockstar's doing, not a broken install. No file mod
;  can ever change their reload timing. This plugin finds their structures in
;  memory (1.2: by the weapon-info class, not by a guess); the "plan:" lines in
;  the log show what each one gets. The High Roller and the Navy crossover use
;  the Double-Action and Navy sections by name prefix.
;
;  Their CALM values are estimates, except the LeMat's (below). COMBAT is the
;  value the game loaded (their stock value) as long as that is faster than
;  Calm_; the Combat_ lines here matter only if some file has slowed them already.
; ============================================================================

[WEAPON_REVOLVER_LEMAT]
