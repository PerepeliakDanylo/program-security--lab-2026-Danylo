; ============================================================================
;  Weapons with no entry in weapons.ymt
;
;  These five have no CWeaponInfo in the game's weapon metadata - verified on
;  stock data, so this is Rockstar's doing, not a broken install. No file mod
;  can ever change their reload timing. This plugin looks them up by name hash
;  in memory instead; if the log says "hash not found in memory" for one of
;  them, that weapon simply cannot be reached by anything and the line below
;  has no effect.
;
;  Their CALM values are estimates, not measurements - nothing was stopwatched
;  because the weapons were unreachable until now. Their COMBAT values assume
;  the engine default of 1.0. Report a stopwatch measurement and these become
;  real numbers.
