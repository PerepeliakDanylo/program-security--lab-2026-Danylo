; ============================================================================
;  DynamicReloadSpeed.ini  --  PRESET: HARDCORE  (strong slowdown)
;  RDR2 Dynamic Reload 1.2 - slow, deliberate reloads out of combat;
;  fast, near-vanilla reloads in a gunfight. Single player only.
;
;  WHICH PRESET IS THIS
;      HARDCORE. The strongest of the three. Out-of-combat reloads take
;      substantially longer than the default profile. Pick this one if you
;      reload as a deliberate act and plan for it; it is unforgiving if you
;      start a reload without checking your surroundings first.
;
;  NO MEMORY-SEARCH SECTION, BY DESIGN
;      This file has no memory-search section - the bracketed Memory section
;      of the main DynamicReloadSpeed.ini - and no build whitelist entry. A
;      preset is a set of reload values, not a set of memory-search parameters:
;      those stay in your own DynamicReloadSpeed.ini and are edited only when
;      the maintainer says so after a game update. The bracketed section name
;      is not spelled out anywhere in this file on purpose: the project
;      verifies its absence from every preset with a plain text search.
;
;  HOW THESE NUMBERS WERE DERIVED
;      Not by hand and not by taste: they come from the REALISTIC profile
;      (the shipped default) through the timing model below, with a single
;      slowdown factor k = 1.5, rounded to 4 decimals:
;
;          Calm_AnimReloadRate           = default / 1.5
;          Calm_TimeBetweenBulletsInLoop = default * 1.5
;          Calm_LoopRate                 = default, unchanged
;
;      LoopRate is deliberately left alone: AnimReloadRate already scales the
;      per-round loop, so scaling LoopRate too would double-count. Because k
;      lowers r and raises tb, every term of T grows - this preset is strictly
;      slower than REALISTIC for every weapon.
;
;      What is NOT claimed: the resulting absolute reload times have not been
;      re-measured with a stopwatch. Only the DIRECTION of the change is
;      derived. TODO: if you want an exact target time per weapon, measure it
;      and re-solve, do not scale twice.
;
;      All derived values stay inside the [MinValue, MaxValue] window below,
;      so nothing here gets clamped: the smallest rate is 0.2133 and the
;      largest time-between is 0.5250.
;
;  TIMING MODEL (this is why the three numbers are not independent)
;      T = A/r + N * L/(lr * r) + N * tb
;      r  = AnimReloadRate            lower  = slower
;      lr = LoopRate                  lower  = slower
;      tb = TimeBetweenBulletsInLoop  higher = slower
;      N  = rounds loaded, A / L = internal animation lengths
;
;  HOW TO USE
;      Back up your DynamicReloadSpeed.ini, copy this file over it, rename it
;      to DynamicReloadSpeed.ini, then press F9 in game or restart. Add your
;      game build to [Versions] afterwards - see the note in that section.
;      With this preset a long-gun reload out of combat is long enough that
;      CooldownSeconds in [General] matters: the slow profile must not come
;      back while you are still being shot at.
;
;  COMBAT values below are the stock Rockstar values, read out of an
;  unmodified weapons.ymt on 2026-09-26 - not guessed. They are identical in
;  all three presets and are NOT affected by k.
; ============================================================================

[General]
Enabled             = 1
CooldownSeconds     = 5.0     ; delay before COMBAT -> CALM; COMBAT is entered instantly
DetectorHz          = 4       ; how often combat signals are polled
PedScanHz           = 2       ; how often nearby peds are enumerated (the expensive signal)
ThreatRadius        = 80.0    ; metres; peds further away are ignored
MaxPedsScanned      = 32      ; how many of the NEAREST peds inside ThreatRadius are checked
DamageMemorySeconds = 8.0     ; "player was hit" and "player shot at a person" stay true this long
DisableInOnline     = 1       ; hard-disable for the rest of the session if a session is detected
; The switch that overrides the build check is deliberately not part of a preset:
; a preset carries values, never a way to turn a safety check off (see README).
; Before entering Red Dead Online, delete DynamicReloadSpeed.asi. The plugin
; disabling itself does not remove the module from the game process.

[Signals]
; Each signal can be turned off independently. Aiming alone never counts as
; combat - it only counts when a hostile is nearby or you were hit recently,
; otherwise aiming at a deer would flip you into COMBAT.
PlayerShooting = 1   ; any shot starts COMBAT; 0 = stay calm while hunting
PlayerAiming   = 1
Melee          = 1
RecentDamage   = 1
HostileNearby  = 1
WantedByLaw    = 1
DeadEye        = 0
AttackingHumans        = 1   ; a shot aimed at a person starts COMBAT even with PlayerShooting = 0
ShootingSustainsCombat = 1   ; during COMBAT/COOLDOWN your own shots keep the fight on

[Profiles]
Mode = auto
; auto   (default) : per weapon, decide whether the value the game loaded at boot
;                    is the STOCK one or an already SLOWED one:
;                      loaded ~= stock  -> COMBAT = loaded, CALM = this file
;                      loaded != stock  -> CALM   = loaded, COMBAT = this file
;                    Every weapon's pair is logged once at start ("plan:" lines).
; manual          : obey CalmSource / CombatSource literally. Deterministic;
;                    use this if you run a third-party weapon overhaul and want
;                    identical behaviour regardless of what it loaded.
CalmSource   = ini
CombatSource = snapshot

[Defaults]
; Fallbacks for any weapon with no section of its own. Scaled by the same
; k = 1.5 as the per-weapon values above, so the documented invariant still
; holds: CalmTimeBetweenMul = 1 / CalmAnimReloadRateMul, and CalmLoopRateMul
; stays 1.00 (AnimReloadRate already scales the loop). The 4-decimal rounding
; leaves the invariant off by about 0.01 %, which is below anything the game
; can express as a difference in timing.
CalmAnimReloadRateMul   = 0.3333  ; 0.50 / 1.5
CalmLoopRateMul         = 1.00    ; DO NOT TOUCH
CalmTimeBetweenMul      = 3.0000  ; 2.00 * 1.5  == 1 / CalmAnimReloadRateMul
CombatAnimReloadRateMul = 1.00
CombatLoopRateMul       = 1.00
CombatTimeBetweenMul    = 1.00
VanillaEpsilon          = 0.02   ; tolerance when comparing a snapshot against [Vanilla]
MinValue                = 0.05   ; nothing below this is ever written
MaxValue                = 12.0   ; nothing above this is ever written.
                                 ; Not 8.0: stock LoopRate for WEAPON_PISTOL_SEMIAUTO is
                                 ; 10.0, and a cap below that would clamp a genuine stock
                                 ; value and leave that pistol permanently slowed.

[Versions]
; Game builds this mod has been run on. An unlisted build is refused (the override
; switch is not part of a preset). The log line "game build" prints your build: it is the
; same four numbers Windows shows in RDR2.exe -> Properties -> Details.
; Both forms are accepted: 1.0.1491.50 and the short 1491.50.
;
; Left EMPTY on purpose: empty means "no check configured, carry on", so a clean
; install works on every build. Uncomment to lock the mod to one build.
; Supported = 1.0.1491.50

[Debug]
LogLevel           = info      ; off | error | info | debug   (debug is verbose, do not leave it on)
LogFile            = DynamicReloadSpeed.log
MaxLogSizeMB       = 32        ; past this the logger writes one line and stops; it never rotates
OnScreenState      = 0         ; 1 = state line on screen + the gun in your hands
HotkeyToggleMod    = F7       ; enable / disable the whole mod, restoring original values
HotkeyForceCombat  = F8        ; force COMBAT, for testing
HotkeyReloadConfig = F9        ; re-read this file without restarting the game

