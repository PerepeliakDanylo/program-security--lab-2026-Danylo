; ============================================================================
;  Weapons with no entry in weapons.ymt
;
;  These five have no CWeaponInfo in the game's weapon metadata - verified on
;  stock data, so this is Rockstar's doing, not a broken install. No file mod
;  can ever change their reload timing. This plugin finds their structures in
;  memory (1.2: by the weapon-info class); the "plan:" lines in the log show
;  what each one gets. The High Roller and the Navy crossover use the
;  Double-Action and Navy sections by name prefix.
;
;  Their CALM values are estimates (the LeMat's base value was re-solved from an
;  in-game measurement in 1.2), and scaling an estimate by k does not make it a
;  measurement. COMBAT is the value the game loaded (their stock value) as long
;  as that is faster than Calm_; the Combat_ lines are unscaled and matter only
;  if some file has slowed these weapons already.
; ============================================================================

