; ============================================================================
;  Per-weapon profiles  --  SUBTLE (k = 0.6)
;
;  Calm_*   : REALISTIC profile scaled through the timing model:
;             rate / 0.6, time-between * 0.6, LoopRate untouched.
;  Combat_* : stock Rockstar values, unscaled. LoopRate and
;             TimeBetweenBulletsInLoop are the GoodCondition values of the
;             weapon's sectioned-reload profile.
;
;  Variant weapons (_MEXICAN, _PIG, _EXOTIC, _GOLDEN, _DUALWIELD, character
;  variants like _JOHN or _SADIE) are matched by longest configured prefix, so
;  WEAPON_REVOLVER_CATTLEMAN_MEXICAN uses [WEAPON_REVOLVER_CATTLEMAN] below.
; ============================================================================

