; ============================================================================
;  Per-weapon profiles
;
;  Calm_*   : measured and tuned, slow. Do not scale these by hand - they were
;             solved from a stopwatch measurement through the timing model above.
;  Combat_* : stock Rockstar values. LoopRate / TimeBetweenBulletsInLoop are the
;             GoodCondition values of the weapon's sectioned-reload profile.
;
;  Variant weapons (_MEXICAN, _PIG, _EXOTIC, _GOLDEN, _DUALWIELD, character
;  variants like _JOHN or _SADIE) are matched by longest configured prefix, so
;  WEAPON_REVOLVER_CATTLEMAN_MEXICAN uses [WEAPON_REVOLVER_CATTLEMAN] below.
; ============================================================================

; ---------------------------------------------------------------- long guns --

[WEAPON_RIFLE_VARMINT]
; 14 rounds, loaded one at a time. Measured 23.7 s before tuning, 18.0 s target,
; ~18 s measured in game - this is the weapon the whole timing model was closed on.
Calm_AnimReloadRate             = 0.5000
Calm_LoopRate                   = 1.6000
Calm_TimeBetweenBulletsInLoop   = 0.1500
Combat_AnimReloadRate           = 1.3000
Combat_LoopRate                 = 2.2000
Combat_TimeBetweenBulletsInLoop = 0.1250

